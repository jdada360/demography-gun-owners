<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="840" viewBox="0 0 2100 840"><rect width="2100" height="840" fill="#FFFFFF"/><text x="60.0" y="76.0" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#16242B" text-anchor="start">More Americans own guns — and they are a different population</text><text x="60.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#6E7F87" text-anchor="start">National Survey of Gun Policy · 7 biennial waves, 2013–2025 · N = 5,494 adult gun owners of 16,709 respondents</text><line x1="60" y1="144" x2="2040" y2="144" stroke="#DCE6E9" stroke-width="3"/><text x="60.0" y="198.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E7F87" text-anchor="start" letter-spacing="1.6">ADULTS WHO OWN A GUN</text><polyline points="150.0,478.6 200.0,506.9 250.0,436.2 300.0,407.9 350.0,379.6 400.0,407.9 450.0,323.1" fill="none" stroke="#B9C6CB" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="200.0" cy="506.9" r="5.5" fill="#B9C6CB"/><circle cx="250.0" cy="436.2" r="5.5" fill="#B9C6CB"/><circle cx="300.0" cy="407.9" r="5.5" fill="#B9C6CB"/><circle cx="350.0" cy="379.6" r="5.5" fill="#B9C6CB"/><circle cx="400.0" cy="407.9" r="5.5" fill="#B9C6CB"/><circle cx="150.0" cy="478.6" r="11" fill="#01a2d9"/><circle cx="450.0" cy="323.1" r="15" fill="#014d64"/><text x="140.0" y="448.6" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#01a2d9" text-anchor="middle">22%</text><text x="140.0" y="520.6" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#6E7F87" text-anchor="middle">2013</text><text x="478.0" y="345.1" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="bold" fill="#014d64" text-anchor="start">33%</text><text x="482.0" y="383.1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#6E7F87" text-anchor="start">2025</text><text x="60.0" y="640.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#6E7F87" text-anchor="start" xml:space="preserve"><tspan font-weight="bold" fill="#16242B">+11 percentage points</tspan><tspan font-weight="normal" fill="#6E7F87"> across seven</tspan></text><text x="60.0" y="676.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#6E7F87" text-anchor="start">biennial waves</text><line x1="760" y1="180" x2="760" y2="700" stroke="#DCE6E9" stroke-width="3"/><text x="810.0" y="198.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E7F87" text-anchor="start" letter-spacing="1.6">AND WHO THEY ARE</text><rect x="810.0" y="231.0" width="20" height="20" rx="4" fill="#01a2d9"/><text x="838.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#6E7F87" text-anchor="start">Female</text><rect x="907.6" y="231.0" width="20" height="20" rx="4" fill="#C3D4DA"/><text x="935.6" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#6E7F87" text-anchor="start">Male</text><text x="810.0" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#6E7F87" text-anchor="start">2013</text><rect x="900.0" y="270" width="199.8" height="44" fill="#01a2d9"/><text x="999.9" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">27%</text><rect x="1099.8" y="270" width="540.2" height="44" fill="#C3D4DA"/><text x="810.0" y="357.0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#6E7F87" text-anchor="start">2025</text><rect x="900.0" y="326" width="288.6" height="44" fill="#01a2d9"/><text x="1044.3" y="357.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">39%</text><rect x="1188.6" y="3