<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="840" viewBox="0 0 2100 840"><rect width="2100" height="840" fill="#FFFFFF"/><text x="60.0" y="78.0" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#16242B" text-anchor="start">US gun owners became more female, more racially diverse, and more Southern</text><text x="60.0" y="116.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#6E7F87" text-anchor="start">National Survey of Gun Policy · 7 biennial waves, 2013–2025 · N = 5,494 adult gun owners of 16,709 respondents</text><line x1="60" y1="146" x2="2040" y2="146" stroke="#DCE6E9" stroke-width="3"/><text x="60.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#6E7F87" text-anchor="start" letter-spacing="1.6">ADULTS WHO OWN A GUN</text><polyline points="90.0,440.9 128.3,463.5 166.7,407.0 205.0,384.3 243.3,361.7 281.7,384.3 320.0,316.5" fill="none" stroke="#B9C6CB" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="128.3" cy="463.5" r="5.5" fill="#B9C6CB"/><circle cx="166.7" cy="407.0" r="5.5" fill="#B9C6CB"/><circle cx="205.0" cy="384.3" r="5.5" fill="#B9C6CB"/><circle cx="243.3" cy="361.7" r="5.5" fill="#B9C6CB"/><circle cx="281.7" cy="384.3" r="5.5" fill="#B9C6CB"/><circle cx="90.0" cy="440.9" r="11" fill="#01a2d9"/><circle cx="320.0" cy="316.5" r="15" fill="#014d64"/><text x="90.0" y="408.9" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#01a2d9" text-anchor="middle">22%</text><text x="90.0" y="484.9" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#6E7F87" text-anchor="middle">2013</text><text x="346.0" y="338.5" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="bold" fill="#014d64" text-anchor="start">33%</text><text x="350.0" y="374.5" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#6E7F87" text-anchor="start">2025</text><text x="60.0" y="612.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#16242B" text-anchor="start">+11 percentage points</text><text x="60.0" y="648.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#6E7F87" text-anchor="start">in gun ownership prevalence</text><line x1="505" y1="180" x2="505" y2="690" stroke="#DCE6E9" stroke-width="3"/><text x="550.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#16242B" text-anchor="start">Female</text><text x="550.0" y="236.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#6E7F87" text-anchor="start">share of all gun owners</text><polyline points="550.0,402.8 595.8,394.8 641.7,370.9 687.5,378.9 733.3,339.1 779.2,355.0 825.0,307.2" fill="none" stroke="#B9C6CB" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="595.8" cy="394.8" r="5.5" fill="#B9C6CB"/><circle cx="641.7" cy="370.9" r="5.5" fill="#B9C6CB"/><circle cx="687.5" cy="378.9" r="5.5" fill="#B9C6CB"/><circle cx="733.3" cy="339.1" r="5.5" fill="#B9C6CB"/><circle cx="779.2" cy="355.0" r="5.5" fill="#B9C6CB"/><circle cx="550.0" cy="402.8" r="11" fill="#01a2d9"/><circle cx="825.0" cy="307.2" r="15" fill="#014d64"/><text x="546.0" y="376.8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#01a2d9" text-anchor="start">27%</text><text x="850.0" y="329.2" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="bold" fill="#014d64" text-anchor="start">39%</text><text x="550.0" y="452.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6E7F87" text-anchor="start">2013</text><text x="825.0" y="452.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#6E7F87" text-anchor="middle">2025</text><text x="1055.0" y="206.0" font-family="Arial, Helv