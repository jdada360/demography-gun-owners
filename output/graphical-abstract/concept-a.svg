width="2100" height="130" fill="#F2F6F7"/><text x="60.0" y="782.0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#014d64" text-anchor="start">The gun-owning population is neither homogeneous nor static — prevention strategies and public health messaging must evolve with it.</text></svg>